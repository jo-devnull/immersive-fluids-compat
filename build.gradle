buildscript {
    repositories {
        maven {
            url = uri("https://repo.spongepowered.org/repository/maven-public/")
        }
        mavenCentral()
    }
    dependencies {
        classpath("org.spongepowered:mixingradle:0.7-SNAPSHOT")
    }
}

plugins {
    id("eclipse")
    id("idea")
    id("net.minecraftforge.gradle") version "[6.0.16,6.2)"
}

apply(plugin = "org.spongepowered.mixin")

val mod_group_id: String by project
val mod_version: String by project
val mod_id: String by project
val mapping_channel: String by project
val mapping_version: String by project

val group = mod_group_id
val version = mod_version

base {
    archivesName.set(mod_id)
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

minecraft {
    mappings(channel = mapping_channel, version = mapping_version)
    copyIdeResources.set(true)

    runs {
        configureEach {
            workingDirectory = project.file("run")

            property("forge.logging.markers", "REGISTRIES")
            property("forge.logging.console.level", "debug")

            mods {
                getByName(mod_id) {
                    source(sourceSets.main.get())
                }
            }
        }

        client {
            property("forge.enabledGameTestNamespaces", mod_id)
        }

        server {
            property("forge.enabledGameTestNamespaces", mod_id)
            args("--nogui")
        }

        gameTestServer {
            property("forge.enabledGameTestNamespaces", mod_id)
        }

        data {
            workingDirectory = project.file("run-data")
            args(
                    "--mod", mod_id, "--all",
                    "--output", file("src/generated/resources/"),
                    "--existing", file("src/main/resources/")
            )
        }
    }
}

mixin {
    add(sourceSets.main.get(), "$mod_id.refmap.json")
    config("$mod_id.mixins.json")
}

sourceSets.main {
    resources.srcDir("src/generated/resources")
}

repositories {
    // empty
}

dependencies {
    minecraft("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor("org.spongepowered:mixin:0.8.5:processor")
}

tasks.named<ProcessResources>("processResources") {
    val replaceProperties = mapOf(
            "minecraft_version" to minecraft_version,
            "minecraft_version_range" to minecraft_version_range,
            "forge_version" to forge_version,
            "forge_version_range" to forge_version_range,
            "loader_version_range" to loader_version_range,
            "mod_id" to mod_id,
            "mod_name" to mod_name,
            "mod_license" to mod_license,
            "mod_version" to mod_version,
            "mod_authors" to mod_authors,
            "mod_description" to mod_description,
    )

    inputs.properties(replaceProperties)

    filesMatching(listOf("META-INF/mods.toml", "pack.mcmeta")) {
        expand(replaceProperties + mapOf("project" to project))
    }
}

tasks.named<Jar>("jar") {
    manifest {
        attributes(
                "Specification-Title" to mod_id,
                "Specification-Vendor" to mod_authors,
                "Specification-Version" to "1",
                "Implementation-Title" to project.name,
                "Implementation-Version" to project.jar.archiveVersion.get(),
                "Implementation-Vendor" to mod_authors,
                "Implementation-Timestamp" to java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ssZ").format(java.util.Date())
        )
    }

    finalizedBy("reobfJar")
}

tasks.withType<JavaCompile>().configureEach {
    options.encoding = "UTF-8"
}